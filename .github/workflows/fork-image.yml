name: Fork image (GHCR)

# Builds the personal fork image off-VPS: regression gate inside the builder stage,
# then the runtime image, pushed to ghcr.io/<owner>/9router.
# Tag: <app>-fork-<sha7>-cli-c<claude>-o<codex>  (same scheme the VPS deploy scripts use).
# No secrets are used besides the automatic GITHUB_TOKEN (packages: write).

on:
  workflow_dispatch:
    inputs:
      rev:
        description: "Commit SHA or branch to build (default: the dispatched ref)"
        required: false
        type: string
      claude_cli_version:
        description: "Claude CLI fingerprint version (default: latest on npm)"
        required: false
        type: string
      codex_cli_version:
        description: "Codex CLI fingerprint version (default: latest on npm)"
        required: false
        type: string

concurrency:
  group: fork-image-${{ inputs.rev || github.ref }}-${{ inputs.claude_cli_version }}-${{ inputs.codex_cli_version }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: github.repository_owner == 'giovannirandykusuma'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.rev || github.ref }}
          fetch-depth: 1

      - name: Resolve versions and tag
        id: meta
        env:
          IN_CLAUDE: ${{ inputs.claude_cli_version }}
          IN_CODEX: ${{ inputs.codex_cli_version }}
        run: |
          set -euo pipefail
          npm_latest() { curl -fsS --max-time 30 "https://registry.npmjs.org/$1/latest" | jq -r .version; }
          CL="${IN_CLAUDE:-$(npm_latest '%40anthropic-ai%2Fclaude-code')}"
          CX="${IN_CODEX:-$(npm_latest '%40openai%2Fcodex')}"
          re='^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'
          [[ "$CL" =~ $re ]] && [[ "$CX" =~ $re ]]
          APP=$(node -p 'require("./package.json").version')
          SHA=$(git rev-parse HEAD)
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          TAG="${APP}-fork-${SHA:0:7}-cli-c${CL//[^0-9A-Za-z_.-]/-}-o${CX//[^0-9A-Za-z_.-]/-}"
          {
            echo "cl=$CL"; echo "cx=$CX"; echo "app=$APP"; echo "sha=$SHA"
            echo "image=ghcr.io/${OWNER}/9router"; echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"
          echo "Building ghcr.io/${OWNER}/9router:${TAG}" >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@v3

      - name: Build builder stage (for the regression gate)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: builder
          load: true
          tags: fork-builder:ci
          build-args: |
            CLAUDE_CLI_VERSION=${{ steps.meta.outputs.cl }}
            CODEX_CLI_VERSION=${{ steps.meta.outputs.cx }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Fork regression gate
        run: |
          docker run --rm --entrypoint sh fork-builder:ci -c \
            'cd /app/tests && npm install --ignore-scripts --no-audit --no-fund --legacy-peer-deps && cd /app && sh scripts/test-oauth-fork.sh'

      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          build-args: |
            CLAUDE_CLI_VERSION=${{ steps.meta.outputs.cl }}
            CODEX_CLI_VERSION=${{ steps.meta.outputs.cx }}
            APP_VERSION=${{ steps.meta.outputs.app }}-fork-${{ steps.meta.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
            personal.fork.revision=${{ steps.meta.outputs.sha }}
          cache-from: type=gha

      - name: Smoke-check image contents
        env:
          IMG: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          APP: ${{ steps.meta.outputs.app }}
          CL: ${{ steps.meta.outputs.cl }}
          CX: ${{ steps.meta.outputs.cx }}
        run: |
          set -euo pipefail
          test "$(docker run --rm --entrypoint node "$IMG" -p 'require("/app/package.json").version')" = "$APP"
          docker run --rm --entrypoint grep "$IMG" -Fq "CLAUDE_CLI_VERSION = \"$CL\"" /app/open-sse/providers/shared.js
          docker run --rm --entrypoint grep "$IMG" -Fq "CODEX_CLI_VERSION = \"$CX\"" /app/open-sse/providers/registry/codex.js
          for f in /app/.next/server/app/api/v1/images/edits/route.js \
                   "/app/.next/server/app/api/mcp-gateway/oauth/[id]/[action]/route.js" \
                   /app/.next/server/app/api/mcp-gateway/keys/usage/route.js; do
            docker run --rm --entrypoint test "$IMG" -f "$f"
          done
          # No env files, databases or VCS metadata may ship in a public image.
          docker run --rm --entrypoint sh "$IMG" -c \
            'found=$(find /app -maxdepth 3 \( -name ".env" -o -name ".env.*" -o -name "*.sqlite" -o -name ".git" \) -not -path "*/node_modules/*" | head -5); test -z "$found" || { echo "unexpected files: $found"; exit 1; }'

      - name: Push to GHCR
        env:
          IMG: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMG"
          DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMG")
          echo "Pushed: \`$IMG\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: \`$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
          echo "FORK_IMAGE_OK $IMG $DIGEST"
